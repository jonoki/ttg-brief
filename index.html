<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Pre-Market Brief — The Tilted Gent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6F5; --panel:#FFFFFF; --ink:#171C21; --ink-2:#4B5560; --mute:#7C8791; --line:#D9DEDC; --line-2:#E9ECEB;
  --accent:#C8891A; --accent-ink:#8A5A0B; --accent-soft:#FBF1DE;
  --hi:#C43C3C; --hi-soft:#F9E3E3; --med:#B7791F; --med-soft:#F8ECD6; --ok:#2F8F5B; --ok-soft:#DFF1E6;
  --g-prior:#3A6EA5; --g-on:#7A5AB8; --g-prof:#2A8C82; --g-week:#5E6B7A; --g-round:#9AA3AB; --g-range:#A0763B; --g-today:#B5443F;
  --last:#171C21;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --cond:"Barlow Condensed","Arial Narrow",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111518; --panel:#181D21; --ink:#E6EAED; --ink-2:#B4BCC3; --mute:#7F8A93; --line:#2B333A; --line-2:#222930;
  --accent:#E0A03A; --accent-ink:#F0C070; --accent-soft:#2E2412;
  --hi:#E25A5A; --hi-soft:#3A1E1E; --med:#D79A3D; --med-soft:#33271A; --ok:#4FB57B; --ok-soft:#1B3125;
  --g-prior:#6C9CD0; --g-on:#A78BE0; --g-prof:#4FB3A8; --g-week:#8B99A8; --g-round:#6F7A83; --g-range:#C69A5C; --g-today:#E06A64;
  --last:#E6EAED;
}}
:root[data-theme="dark"]{
  --bg:#111518; --panel:#181D21; --ink:#E6EAED; --ink-2:#B4BCC3; --mute:#7F8A93; --line:#2B333A; --line-2:#222930;
  --accent:#E0A03A; --accent-ink:#F0C070; --accent-soft:#2E2412;
  --hi:#E25A5A; --hi-soft:#3A1E1E; --med:#D79A3D; --med-soft:#33271A; --ok:#4FB57B; --ok-soft:#1B3125;
  --g-prior:#6C9CD0; --g-on:#A78BE0; --g-prof:#4FB3A8; --g-week:#8B99A8; --g-round:#6F7A83; --g-range:#C69A5C; --g-today:#E06A64;
  --last:#E6EAED;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 22px 48px}
h1,h2,h3{font-family:var(--cond);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.eyebrow{font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* status strip */
.strip{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.4fr;gap:14px;align-items:stretch;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:14px 0 12px;margin-bottom:22px}
.strip .cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.strip .big{font-family:var(--cond);font-size:26px;line-height:1;font-weight:600}
.strip .sub{color:var(--ink-2);font-size:13px}
.countdown{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px}
.countdown .big{color:var(--accent-ink)}
.countdown.soon{background:var(--hi-soft);border-left-color:var(--hi)} .countdown.soon .big{color:var(--hi)}
.countdown.none{background:transparent;border-left-color:var(--line)}
.stale{display:inline-block;padding:1px 7px;border-radius:3px;font-family:var(--mono);font-size:11px;background:var(--hi-soft);color:var(--hi);margin-left:6px}

/* grids */
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-bottom:26px}
.ladders{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:26px}
@media (max-width:860px){.two,.ladders,.strip{grid-template-columns:1fr}}
section>h2{margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}

/* calendar table */
table{border-collapse:collapse;width:100%}
.cal td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.cal tr.day td{padding-top:12px;border-bottom:none}
.cal .when{white-space:nowrap;width:1%}
.cal .when small{color:var(--mute);margin-left:6px}
.cal .name{font-weight:500}
.cal .nums{white-space:nowrap;color:var(--ink-2);font-size:12.5px}
.cal .nums b{color:var(--ink);font-weight:600}
.imp{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px;background:var(--line)}
.imp.high{background:var(--hi)} .imp.medium{background:var(--med)} .imp.holiday{background:var(--g-week)}
tr.past td{color:var(--mute)} tr.past .imp{opacity:.5} tr.past .nums b{color:var(--ink-2)}
.src{color:var(--mute);font-size:11px;white-space:nowrap}
.src.one{color:var(--med)}
.cal .name{position:relative}
.info{display:inline-block;margin-left:6px;width:14px;height:14px;line-height:13px;text-align:center;border-radius:50%;border:1px solid var(--line);color:var(--mute);font-size:10px;font-family:var(--mono);cursor:help;vertical-align:1px;background:transparent;padding:0}
.info:hover,.info:focus-visible{border-color:var(--accent);color:var(--accent-ink)}
.card{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:5;width:min(46ch,70vw);background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.10);padding:8px 10px;font-size:12px;line-height:1.45;color:var(--ink);font-weight:400;white-space:normal}
.card b{display:block;font-family:var(--cond);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.card p{margin:0 0 6px} .card p:last-child{margin:0}
.name:hover .card,.name:focus-within .card{display:block}

/* what matters */
.matters ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.matters li{padding-left:14px;border-left:2px solid var(--line);max-width:62ch}
.matters li:first-child{border-left-color:var(--accent)}
.matters .cite{color:var(--mute);font-family:var(--mono);font-size:10.5px;margin-left:4px}
.matters .meta{color:var(--mute);font-size:12px;margin-top:10px}
.heads{margin-top:14px}
.heads li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.heads .sc{font-family:var(--mono);color:var(--mute);font-size:11px;padding-top:2px}
.heads a{text-decoration:none} .heads a:hover{text-decoration:underline}
.heads .m{color:var(--mute);font-size:11px}

/* earnings */
.earn table td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:top}
.earn .sym{font-family:var(--mono);font-weight:600;white-space:nowrap}
.earn .co{color:var(--ink-2);font-size:12px}
.earn .eps{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.earn .tag{display:inline-block;padding:0 6px;border-radius:3px;font-family:var(--cond);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.earn .beat{background:var(--ok-soft);color:var(--ok)} .earn .miss{background:var(--hi-soft);color:var(--hi)} .earn .inline{background:var(--line-2);color:var(--ink-2)}
.earn .when{color:var(--mute);font-size:11px;white-space:nowrap}
.earn .grp{font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-top:10px}

/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:26px}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .axis{fill:var(--mute);font-size:10px}
.chart .rth{fill:var(--ink);opacity:.045}
.chart .gap{fill:url(#hatch);opacity:.9}
.chart .gaplbl{fill:var(--ink-2);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.chart .sess{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.chart .wick{stroke-width:1}
.chart .up{stroke:var(--ok);fill:var(--ok)} .chart .dn{stroke:var(--hi);fill:var(--hi)}
.chart .lvl{stroke-width:1.25;stroke-dasharray:5 3;opacity:.9}
.chart .lvl.last{stroke:var(--last);stroke-dasharray:none;stroke-width:1.5;opacity:1}
.chart .lbl{font-size:10px;fill:var(--ink-2)} .chart .lbl.last{fill:var(--ink);font-weight:600}
.chart .lbl-bg{fill:var(--bg);opacity:.85}
.chart .xh{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.chart .hit{fill:transparent}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:5px 8px;font:11px/1.4 var(--mono);color:var(--ink);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08);display:none}
.chart h2 .src{float:right;font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0;color:var(--mute);font-size:11px}

/* ladders */
.ladder h2 .last{float:right;font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.ladder table td{padding:3px 6px;border-bottom:1px solid var(--line-2);font-size:13px}
.ladder .px{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;width:1%;white-space:nowrap;text-align:right}
.ladder .d{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--mute);width:1%;white-space:nowrap;text-align:right;font-size:12px}
.ladder .lb{white-space:nowrap}
.ladder .lb::before{content:"";display:inline-block;width:10px;height:3px;margin-right:8px;vertical-align:3px;background:var(--c)}
.ladder .nt{color:var(--mute);font-size:11.5px}
.ladder tr.last td{border-top:2px solid var(--last);border-bottom:2px solid var(--last);background:var(--panel);font-weight:600}
.ladder tr.last .lb::before{display:none}
.ladder .stats{margin-top:8px;color:var(--ink-2);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 16px}
.ladder .stats b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mute);margin:-14px 0 22px}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;margin-right:6px;vertical-align:3px;background:var(--c)}

/* flags & foot */
.flags{margin-bottom:22px}
.flags ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.flags li{font-size:12.5px;padding:5px 10px;background:var(--med-soft);border-left:3px solid var(--med);color:var(--ink)}
.flags li.down{background:var(--hi-soft);border-left-color:var(--hi)}
.foot{color:var(--mute);font-size:11.5px;display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line);padding-top:10px}
.foot .ok{color:var(--ok)} .foot .bad{color:var(--hi)}
.empty{color:var(--mute);font-style:italic}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.countdown .big{transition:color .3s}}
.brand,.disclaimer{display:none}
/* The Tilted Gent skin — black / gold / crimson, Cinzel display. One committed dark look. */
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root, :root:not([data-theme="light"]), :root[data-theme="dark"], :root[data-theme="light"]{
  --bg:#0B0A0A; --panel:#141212; --ink:#F3EBDD; --ink-2:#CBBFA8; --mute:#8E8474; --line:#2C2620; --line-2:#1E1A17;
  --accent:#D4AF37; --accent-ink:#E9C85A; --accent-soft:#1E1A0E;
  --hi:#C8102E; --hi-soft:#2A0D12; --med:#D4AF37; --med-soft:#241E0E; --ok:#5FB57B; --ok-soft:#12261A;
  --g-prior:#D4AF37; --g-on:#C97B84; --g-prof:#8FBFB5; --g-week:#9A8F7C; --g-round:#6B6257; --g-range:#B08A4A; --g-today:#C8102E;
  --last:#F3EBDD;
  --cond:"Cinzel","Times New Roman",serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{background:radial-gradient(1200px 500px at 50% -120px, #1C1608 0%, var(--bg) 60%) fixed var(--bg)}
h1{font-family:var(--cond);font-weight:700;letter-spacing:.04em;color:var(--accent-ink);text-transform:uppercase;font-size:28px}
h2{font-family:var(--cond);font-weight:600;letter-spacing:.14em;color:var(--accent);font-size:13px}
section>h2{border-bottom:1px solid var(--accent);border-image:linear-gradient(90deg,var(--accent),transparent 70%) 1}
.eyebrow{color:var(--mute);font-family:var(--sans);letter-spacing:.18em}
.strip{border-top:2px solid var(--accent);border-bottom:1px solid var(--line);box-shadow:0 -1px 0 rgba(212,175,55,.25), 0 -6px 18px -8px rgba(212,175,55,.45)}
.strip .big{font-family:var(--cond);font-size:22px;letter-spacing:.02em}
.countdown{background:var(--accent-soft);border-left:3px solid var(--accent)}
.countdown.soon{background:var(--hi-soft);border-left-color:var(--hi)} .countdown.soon .big{color:#FF4D64}
.ladder tr.last td{background:var(--accent-soft);color:var(--accent-ink)}
.ladder .px{color:var(--ink)}
.cal .name{color:var(--ink)}
.imp.high{background:var(--hi);box-shadow:0 0 6px rgba(200,16,46,.7)} .imp.medium{background:var(--accent);box-shadow:0 0 6px rgba(212,175,55,.6)}
a{color:var(--accent-ink)} .heads a{color:var(--ink)} .heads a:hover{color:var(--accent-ink)}
.earn .tag.inline{background:var(--accent-soft);color:var(--accent-ink)}
.card{background:var(--panel);border:1px solid var(--accent);box-shadow:0 0 0 1px rgba(200,16,46,.35) inset, 0 10px 30px rgba(0,0,0,.6)}
.info{border-color:var(--accent);color:var(--accent)}

/* brand header */
.brand{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.brand .logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand .card-mark{display:inline-grid;place-items:center;width:44px;height:58px;border:2px solid var(--accent);border-radius:6px;transform:rotate(-8deg);font-family:var(--cond);font-weight:700;font-size:18px;color:var(--accent-ink);background:linear-gradient(160deg,#171310,#0B0A0A);box-shadow:0 0 0 1px rgba(200,16,46,.6) inset,0 0 14px rgba(212,175,55,.45);letter-spacing:-.04em}
.brand .card-mark::after{content:"♠";position:relative;top:-16px;left:14px;font-size:10px;color:var(--hi)}
.brand .wordmark{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);text-shadow:0 0 10px rgba(212,175,55,.35)}
.brand .tag{margin-left:auto;font-family:var(--cond);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.disclaimer{display:block;margin:0 0 16px;padding:8px 12px;border-left:3px solid var(--hi);background:var(--hi-soft);color:var(--ink-2);font-size:12.5px}
.foot{border-top:1px solid var(--line)}
@media (max-width:600px){.brand .tag{display:none}.brand .wordmark{font-size:16px}}

</style>

<div class="wrap" id="app">
  <div class="brand" id="brand"></div>
  <div class="eyebrow" id="eyebrow">Day Trading Aid · ES / NQ</div>
  <h1 id="title">Pre-market brief</h1>
  <div class="disclaimer" id="disclaimer"></div>
  <div class="strip" id="strip"></div>
  <div class="two">
    <section class="calendar"><h2>Calendar</h2><div id="cal"></div></section>
    <section class="matters"><h2>What matters today</h2><div id="matters"></div>
      <h2 style="margin-top:22px">Earnings · index movers</h2><div id="earn"></div></section>
  </div>
  <div class="charts" id="charts"></div>
  <div class="ladders" id="ladders"></div>
  <div class="legend" id="legend"></div>
  <section class="flags" id="flags"></section>
  <div class="foot" id="foot"></div>
</div>

<script>
window.__BRIEF__ = null;
window.__PUBLIC__ = true;      // public site variant: no provider data, no connector
(function(){
  const PUBLIC = !!window.__PUBLIC__;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const GROUP = {prior_day:"--g-prior", overnight:"--g-on", profile:"--g-prof", week:"--g-week", round:"--g-round", range:"--g-range", today:"--g-today"};
  const GROUP_LABEL = {prior_day:"prior day (PDH/PDL/PDC)", overnight:"overnight (ONH/ONL)", profile:"profile (POC / VAH / VAL)", week:"week", round:"round numbers", range:"ATR range", today:"today (HOD/LOD)"};
  const fmtLocal = (iso, tz) => iso ? new Date(iso).toLocaleTimeString("en-CA", {hour:"2-digit", minute:"2-digit", hour12:false, timeZone: tz}) : "";
  const px = (n) => n == null ? "" : n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});

  // The levels worth drawing on the chart, by tag. Everything else stays in the ladder.
  const CHART_TAGS = {pdh:"PDH", pdl:"PDL", pdc:"PDC", onh:"ONH", onl:"ONL", poc:"POC", vah:"VAH", val:"VAL", tdh:"HOD", tdl:"LOD"};

  function etParts(iso){
    const d = new Date(iso);
    const p = new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", hour:"2-digit", minute:"2-digit", hour12:false, weekday:"short"}).formatToParts(d);
    const get = (k) => (p.find(x => x.type === k) || {}).value;
    return {h: +get("hour") % 24, m: +get("minute"), wd: get("weekday")};
  }

  function drawChart(ls, host, tip, tz){
    const bars = ls.bars || [];
    if (!bars.length){ host.innerHTML = PUBLIC ? "" : `<p class="empty">No bars in this brief — chart needs the local run.</p>`; return; }
    const W = 600, H = 300, padL = 8, padR = 96, padT = 10, padB = 22;
    const iw = W - padL - padR, ih = H - padT - padB;
    const lv = ls.levels.filter(l => CHART_TAGS[l.tag]);
    const prices = bars.flatMap(b => [b.h, b.l]).concat(lv.map(l => l.price), ls.last_price != null ? [ls.last_price] : []);
    let lo = Math.min(...prices), hi = Math.max(...prices);
    const span = (hi - lo) || 1; lo -= span * 0.04; hi += span * 0.04;
    const y = (p) => padT + (hi - p) / (hi - lo) * ih;
    // Bar positions in slot units. The market is closed 17:00→18:00 ET daily and Fri 17:00→Sun 18:00; instead of
    // hiding that, any gap wider than one candle gets a fixed-width hatched band with the reason and length.
    const GAPW = 3, pos = [], gaps = [];
    bars.forEach((b, i) => {
      if (i === 0){ pos.push(0); return; }
      const mins = (new Date(b.t) - new Date(bars[i-1].t)) / 60000;
      if (mins > 15){
        const h = Math.round((mins - 15) / 60), prevDay = etParts(bars[i-1].t).wd;
        const why = h >= 40 ? "weekend" : h >= 20 ? "holiday" : "closed";
        gaps.push({at: pos[i-1] + 1, label: `${why} · ${h >= 24 ? Math.round(h/24*10)/10 + "d" : h + "h"}`, from: prevDay});
        pos.push(pos[i-1] + 1 + GAPW);
      } else pos.push(pos[i-1] + 1);
    });
    const n = bars.length, units = pos[n-1] + 1, slot = iw / units, cw = Math.max(1.5, Math.min(6, slot * 0.7));
    const xl = (i) => padL + pos[i] * slot;               // left edge of bar i
    const x = (i) => xl(i) + slot / 2;                    // centre of bar i
    let s = "";
    // RTH shading + session boundaries + hour ticks
    let rthStart = null, lastLblX = -1e9;
    const lbls = [];                                     // session-open labels win over hour ticks when crowded
    const xlbl = (xx, text, force) => { if (!force && xx - lastLblX < 46) return; if (force) while (lbls.length && xx - lbls[lbls.length-1].x < 46) lbls.pop(); lastLblX = xx; lbls.push({x: xx, text}); };
    bars.forEach((b, i) => {
      const e = etParts(b.t);
      const inRth = (e.h > 9 || (e.h === 9 && e.m >= 30)) && e.h < 16;
      if (inRth && rthStart === null) rthStart = i;

      if (e.h === 18 && e.m === 0){ s += `<line class="sess" x1="${xl(i)}" x2="${xl(i)}" y1="${padT}" y2="${padT + ih}"/>`; xlbl(xl(i), `18:00 ${e.wd}`, true); }

    });

    }

      s += `<rect class="${cls}" x="${x(i) - cw/2}" y="${top}" width="${cw}" height="${Math.max(1, bot - top)}"/>`;

      const txt = `${it.label} ${it.price.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

  // Hosted page: where brief.json lives (a private GitHub repo the runner pushes to).

  const REFETCH_MS = 60 * 1000;                 // the watcher republishes within a minute of a print

  function status(msg, sub){ $("strip").innerHTML = `<div class="cell"><div class="big">${esc(msg)}</div><div class="sub">${esc(sub||"")}</div></div>`; }

  // Decode a GitHub get_file_contents result. Observed shape (one real call, 4 Sep 2026): a text block
  // "successfully downloaded text file (SHA: …)" followed by an embedded resource block whose text is the file.
  function decodeGithub(result){
    const blocks = (result && result.content) || [];
    for (const b of blocks){
      const txt = b && b.resource && typeof b.resource.text === "string" ? b.resource.text : (b && b.type === "resource" && typeof b.text === "string" ? b.text : null);
      if (txt){ try { const j = JSON.parse(txt); if (j && j.meta) return j; } catch (e) {} }
    }
    if (result && result.payload && typeof result.payload === "object" && result.payload.meta) return result.payload;
    for (const b of blocks){
      if (b && b.type === "text" && typeof b.text === "string"){ try { const j = JSON.parse(b.text); if (j && j.meta) return j; } catch (e) {} }
    }
    return null;
  }

  async function loadViaConnector(){
    if (!window.claude || typeof window.claude.use !== "function") return false;
    const mcp = await window.claude.use("mcp");
    if (!mcp) return false;
    status("Loading brief…", `reading ${SOURCE.owner}/${SOURCE.repo}/${SOURCE.path} through your GitHub connector`);
    let got = false;
    mcp.watchTool("GitHub", "get_file_contents", SOURCE, (ev) => {
      if (ev.type === "data"){
        const brief = decodeGithub(ev.result);
        if (brief){ got = true; window.__BRIEF__ = brief; render(brief); return; }
        status("Brief file unreadable", "get_file_contents answered but no brief JSON was found in the response — check that brief.json exists in the repo.");
        return;
      }
      const e = ev.error || {};
      const fix = {
        needs_reauth: "Reconnect GitHub in claude.ai Settings → Connectors, then reload.",
        server_not_connected: "Add the GitHub connector in claude.ai Settings → Connectors, then reload.",
        selection_required: "Choose which GitHub connector to use when prompted, then reload.",
        not_in_manifest: "This page is only allowed to call get_file_contents — republish if the manifest changed.",
        tool_error: "GitHub reported an error — most likely the repo or brief.json does not exist yet.",
        server_unavailable: "GitHub is briefly unreachable; the page will retry.",
      }[e.code] || ("Could not read the brief (" + (e.code || "unknown") + ").");
      if (!got) status("Brief not loaded", fix + (e.message ? " — " + e.message : ""));
      else $("foot").insertAdjacentHTML("beforeend", `<span class="bad">refresh failed: ${esc(e.code||"")}</span>`);
    }, {refetchInterval: REFETCH_MS});
    return true;
  }

  async function loadStatic(first){             // GitHub Pages / any static host: brief.json beside the page
    try {
      const r = await fetch("./brief.json?t=" + Date.now(), {cache:"no-store"});
      if (r.ok){ const j = await r.json(); if (j && j.meta){ window.__BRIEF__ = j; render(j); return true; } }
    } catch (e) {}
    if (first) status("No brief loaded", PUBLIC ? "The brief has not been published yet — check back shortly." : "Open the generated brief.html, serve brief.json next to this page, or view the hosted page with the GitHub connector.");
    return false;
  }
  async function load(){
    if (window.__BRIEF__) return render(window.__BRIEF__);
    if (!PUBLIC){ try { if (await loadViaConnector()) return; } catch (e) {} }
    await loadStatic(true);
    setInterval(() => loadStatic(false), REFETCH_MS);
  }
  load();
  setInterval(() => { if (window.__BRIEF__) render(window.__BRIEF__); }, 30000);   // keep the countdown honest
})();
</script>
